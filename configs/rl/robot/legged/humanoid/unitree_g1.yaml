robot:
  id: unitree_g1
  asset_config: data/robot/assets/humanoid/unitree_g1/unitree_g1_cfg.py
  asset_symbol: UNITREE_G1_CFG
  controlled_actuators: [legs, feet, waist]
  controlled_joints:
    - ".*_hip_.*_joint"
    - ".*_knee_joint"
    - ".*_ankle_.*_joint"
    - "waist_.*_joint"
  base: torso_link
  feet: [left_ankle_roll_link, right_ankle_roll_link]
  body_height: 0.78
  foot_clearance_height: 0.07

control:
  action_scale: 0.25

command:
  linear_x: [-1.0, 1.0]
  linear_y: [-1.0, 1.0]
  angular_z: [-1.0, 1.0]
