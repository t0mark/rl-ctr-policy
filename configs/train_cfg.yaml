# 논문 핵심 로직과 명시적 구현 가정으로 구성한 학습 설정.
policy:
  init_noise_std: 1.0
  activation: elu
  normalization_min_std: 0.1

algorithm:
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.01
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 1.0e-3
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  velocity_loss_coef: 1.0
  prediction_loss_coef: 1.0
  beta: 1.0

adaboot:
  enabled: true
  min_episodes: 2
  epsilon: 1.0e-6

runner:
  policy_class_name: ActorCritic_DWAQ
  algorithm_class_name: PPO
  num_steps_per_env: 24
  save_interval: 50
